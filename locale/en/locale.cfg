roboport-productivity=Increases the amount of robots that can charge at roboports.
roboport-efficiency=Increases the amount of energy that roboports can store.
roboport-construction-area=The area that construction robots can build in.
roboport-logistic-area=Increases the area that logistic robots can work in.
roboport-robot-storage=Increases the amount of robots that can be stored in a roboport.
roboport-material-storage=Increases the amount of __ITEM__repair-pack__ that can be stored in a roboport.
