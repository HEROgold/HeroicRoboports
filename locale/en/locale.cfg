[mod-setting-description]
energy-research-limit=Maximum amount of upgrades/researches (Limits other mods from adding more upgrades)
research-minimum=The minimum amount of upgrades/researches available in the game.
input-flow-limit-modifier=How quickly a roboport charges itself
buffer-capacity-modifier=How much energy a roboport can hold
recharge-minimum-modifier=How much power is needed before a roboport can turn on
energy-usage-modifier=How much energy the roboport uses when idle
charging-energy-modifier=How quickly the roboport charges a robot.
upgrade-timer=How often (in ticks) the mod should upgrade tracked roboports.
show-items=Adds items to the game (for debugging purposes or fixing certain issues)
research-upgrade-cost=The amount of research packs required for each upgrade
research-upgrade-time=The amount of time each upgrade takes to research
energy-efficiency-limit=The Maximum amount of researches for the energy efficiency (Limits other mods from adding more upgrades)
energy-productivity-limit=The Maximum amount of researches for the energy productivity (Limits other mods from adding more upgrades)
energy-speed-limit=The Maximum amount of researches for the energy speed (Limits other mods from adding more upgrades)
research-maximum=The maximum amount of upgrades/researches available in the game.
construction-area-limit=The Maximum amount of researches for the construction area
logistic-area-limit=The Maximum amount of researches for the logistic area
material-storage-limit=The Maximum amount of researches for the material storage

logistical-roboport-logistics-radius=Base logistics radius (in tiles) for Logistical Roboports; offsets per research level are applied separately.
logistical-roboport-construction-radius=Base construction radius (in tiles) for Logistical Roboports; offsets per research level are applied separately.

energy-roboport-logistics-radius-modifier=Offset applied to the roboport's logistics radius per research level for Energy Roboports.
energy-roboport-construction-radius-modifier=Offset applied to the roboport's construction radius per research level for Energy Roboports.
energy-roboport-robot-slots=Base number of robot slots for Energy Roboports; this value is the starting slot count before any upgrades.
energy-roboport-material-slots=Base number of material slots for Energy Roboports; this value is the starting material capacity before any upgrades.
energy-roboport-logistics-radius=Base logistics radius (in tiles) for Energy Roboports; offsets per level are applied separately.
energy-roboport-construction-radius=Base construction radius (in tiles) for Energy Roboports; offsets per level are applied separately.

logistical-roboport-logistics-radius-modifier=Offset applied to the roboport's logistics radius per research level for Logistical Roboports.
logistical-roboport-construction-radius-modifier=Offset applied to the roboport's construction radius per research level for Logistical Roboports.
logistical-roboport-robot-slots=Base number of robot slots for Logistical Roboports; this value is the starting slot count before any upgrades.
logistical-roboport-material-slots=Base number of material slots for Logistical Roboports; this value is the starting material capacity before any upgrades.
logistical-roboport-robot-modifier=Number of robot slots added per research level for Logistical Roboports.
logistical-roboport-material-modifier=Number of material slots added per research level for Logistical Roboports.

